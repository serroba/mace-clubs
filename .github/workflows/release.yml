name: Release

permissions:
  contents: write

on:
  push:
    tags: ['v*']

jobs:
  release:
    name: Build and publish .iq package
    runs-on: ubuntu-latest
    container:
      # Pinned like every other consumer of this image, and checked by
      # tools/container-image.test.ts. This was the last :latest reference in
      # the repo, which put the one job that builds the artifact users install
      # on a floating tag while five comments elsewhere explained why that is
      # a bad idea. v2.10.0 is what build-shards compiles all 120 manifest
      # devices with on every pull request, so it is the version the export
      # is already known to handle.
      image: ghcr.io/matco/connectiq-tester:v2.10.0
    steps:
      - uses: actions/checkout@v6

      # The About row is the only place the watch reports its version, so a
      # tag whose artifact would misreport itself must fail the release.
      - name: Verify tag matches AppVersion.LABEL
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -q "const LABEL = \"$tag\"" source/app/AppVersion.mc || {
            echo "::error::AppVersion.LABEL does not match tag $GITHUB_REF_NAME - bump source/app/AppVersion.mc"; exit 1; }

      - name: Restore signing key
        env:
          CIQ_DEVELOPER_KEY: ${{ secrets.CIQ_DEVELOPER_KEY }}
        run: |
          test -n "$CIQ_DEVELOPER_KEY" || { echo "::error::CIQ_DEVELOPER_KEY secret is not set"; exit 1; }
          echo "$CIQ_DEVELOPER_KEY" | base64 -d > /tmp/developer_key.der

      - name: Build store package (.iq, all manifest devices)
        run: |
          mkdir -p dist
          monkeyc -f monkey.jungle -e -r -o dist/mace-clubs.iq -y /tmp/developer_key.der

      - name: Build Instinct 3 Solar sideload binary
        run: |
          monkeyc -f monkey.jungle -d instinct3solar45mm -r \
            -o dist/mace-clubs-instinct3solar.prg -y /tmp/developer_key.der

      - name: Shred signing key
        if: always()
        run: rm -f /tmp/developer_key.der

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/mace-clubs.iq
            dist/mace-clubs-instinct3solar.prg
