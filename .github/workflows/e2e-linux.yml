name: E2E UI tests (Linux)

# The real e2e UI suite (tools/e2e/*.e2e.test.ts) running headlessly on a
# GitHub-hosted runner - the same test files the macOS driver runs locally,
# through platform-linux.ts's Xvfb/xdotool/ImageMagick/Tesseract backend.
#
# Device fonts are fetched at job time through Garmin's own authenticated
# API via connect-iq-sdk-manager-cli, using this repo's GARMIN_USERNAME /
# GARMIN_PASSWORD secrets - nothing proprietary lives in an image, the repo,
# or a registry, and the fonts only ever touch the runner's ephemeral disk.
# They're cached, so credentials are exercised once per cache key.
#
# The suite fans out across screen sizes. The driver reads each device's
# screenshot crop, MENU hotspot and window size from its own simulator.json,
# so one set of test files covers all of them. This matters because the
# layout defects worth catching only appear off the Instinct: on a 454px
# screen the footer labels used to overlap into "setrndshr" and the headline
# number overdrew its own caption, both invisible at 176px.
#
# Runs on PRs from branches in this repo, on main, on release tags, and on
# demand. Only *fork* PRs are excluded (the `if` below): GitHub withholds
# secrets from them, so the font fetch can't work - they skip cleanly
# rather than failing on a missing credential.
#
# The release-tag run is informational, not a gate: release.yml triggers on
# the same tag and runs alongside this, so a failure here won't stop a
# release that's already tagged. The pre-push hook (.githooks/pre-push) is
# the actual release gate; this is the CI-side record of the same check.

permissions:
  contents: read

# Path-filtered to changes that can actually alter what's on the watch
# screen (or how it's driven) - this suite takes ~8 minutes and most PRs
# here touch the FIT/report tooling, docs, or video analysis instead.
# Release tags deliberately carry no filter: GitHub skips path evaluation
# for tag pushes entirely, so a tagged release always gets a full run
# whatever the tagged commit happened to touch.
on:
  pull_request:
    paths: &ui-paths
      - "source/**" # the app itself
      - "resources/**" # strings, drawables, layouts
      - "manifest.xml" # target devices and permissions
      - "*.jungle" # what gets compiled in
      - "tools/e2e/**" # the driver and the tests
      - "tools/package.json" # the driver's own dependencies
      - "tools/package-lock.json"
      - ".github/workflows/e2e-linux.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths: *ui-paths
  workflow_dispatch:

jobs:
  e2e:
    name: E2E UI suite (${{ matrix.device }})
    # Fork PRs get no secrets, so the font fetch would fail - skip instead.
    # Always true for pushes and workflow_dispatch (no pull_request payload).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One per layout class the app actually renders differently:
        # semi-octagon with a subwindow, plain round MIP, and the large round
        # AMOLED where the fixed-pixel layout used to break outright.
        device:
          - instinct3solar45mm
          - fenix7
          - venu3
    container:
      image: ghcr.io/matco/connectiq-tester:latest
    defaults:
      run:
        # The container's /bin/sh is dash; these scripts need bash.
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install display, input, screenshot, and OCR tooling
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            xvfb xdotool imagemagick tesseract-ocr openbox curl ca-certificates
          # Node for the driver itself - the base image has none (it was
          # only ever meant to compile and unit-test Monkey C).
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y -qq --no-install-recommends nodejs

      - name: Install driver dependencies
        run: npm ci --prefix tools

      # Both the fonts and the device's own skin/metadata come from the same
      # download, and both are needed: the fonts to draw anything at all, the
      # simulator.json for the driver's crop geometry.
      - name: Cache device files
        id: fonts-cache
        uses: actions/cache@v4
        with:
          path: |
            /root/.Garmin/ConnectIQ/Fonts
            /root/.Garmin/ConnectIQ/Devices
          key: ciq-device-${{ matrix.device }}-cli-v0.8.4

      - name: Fetch device files via Garmin's authenticated API
        if: steps.fonts-cache.outputs.cache-hit != 'true'
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          test -n "$GARMIN_USERNAME" || { echo "::error::GARMIN_USERNAME secret is not set"; exit 1; }
          test -n "$GARMIN_PASSWORD" || { echo "::error::GARMIN_PASSWORD secret is not set"; exit 1; }
          curl -sL "https://github.com/lindell/connect-iq-sdk-manager-cli/releases/download/v0.8.4/connect-iq-sdk-manager-cli_0.8.4_Linux_x86_64.tar.gz" \
            | tar xz -C /tmp connect-iq-sdk-manager
          export HOME=/root
          # Hash of the agreement at developer.garmin.com/downloads/connect-iq/sdks/agreement.html,
          # read and accepted by the repo owner (also previously accepted via
          # the official SDK Manager). Re-read and bump when the CLI reports
          # a hash mismatch.
          /tmp/connect-iq-sdk-manager agreement accept -H CC737BBBA104D7740D5BBCF27D0F6382
          /tmp/connect-iq-sdk-manager login
          /tmp/connect-iq-sdk-manager device download -d "${{ matrix.device }}" --include-fonts
          echo "fonts downloaded: $(find /root/.Garmin/ConnectIQ/Fonts -type f | wc -l) files"
          # The simulator only needs Fonts/; keep the session token out of
          # the cached path.
          rm -f /root/.Garmin/ConnectIQ/token.json

      - name: Run the e2e UI suite
        env:
          MACE_E2E_DEVICE: ${{ matrix.device }}
        run: bash tools/e2e/linux/run-suite.sh

      # Screenshots of whatever the driver last saw, for diagnosing a
      # failure that can't be reproduced locally.
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshot-diffs-${{ matrix.device }}
          path: tools/e2e/.diffs/
          if-no-files-found: ignore

      # Always, not just on failure: when a device joins the matrix its Linux
      # baselines do not exist yet, so the first run seeds them (and warns
      # that it compared nothing). Download them from here and commit them so
      # later runs actually check the layout.
      - name: Upload screenshot baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-baselines-${{ matrix.device }}
          path: tools/e2e/baselines/linux/${{ matrix.device }}/
          if-no-files-found: ignore
