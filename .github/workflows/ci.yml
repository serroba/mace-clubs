name: CI

permissions:
  contents: read

env:
  # bombsimon/monkey-c-rs revision, shared by the lint and coverage jobs so
  # they cannot drift apart; bump deliberately (no releases yet). 93d004f adds
  # the bool-comparison and local naming-convention rules, and is the first
  # revision where the toolchain is the single rafiki binary.
  MONKEY_C_RS_REV: 93d004f1f26af98c96dc36be10ab841f035f0dbb

# Supersede an in-flight run when the same ref is pushed again. Without this
# a force-push leaves the old run grinding away on a commit that no longer
# exists - observed here holding runner slots while its own replacement
# queued behind it. Only for pull requests: a run on main or on a tag is the
# record of what actually shipped, and nothing newer supersedes it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fit-report:
    name: Local FIT report tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install report dependencies
        run: npm ci --prefix tools
      # tsconfig includes every tools/*.ts file and eslint covers the whole
      # directory, so untested CLIs are still typechecked and linted here.
      - name: Typecheck all TypeScript at maximum strictness
        run: npm run typecheck --prefix tools
      - name: Lint all TypeScript
        run: npm run lint --prefix tools
      - name: Test report generator with coverage
        run: |
          # pipefail, or `| tee` swallows a coverage-gate failure and the
          # step passes on tee's exit code instead. GitHub's default shell is
          # `bash -e`, without it.
          set -o pipefail
          node --experimental-strip-types --test --experimental-test-coverage \
            --test-coverage-include='tools/analyze-workout.ts' \
            --test-coverage-include='tools/report-fit.ts' \
            --test-coverage-include='tools/validate-workout.ts' \
            --test-coverage-include='tools/workout-history.ts' \
            --test-coverage-include='tools/fit-io.ts' \
            --test-coverage-lines=95 \
            tools/analyze-workout.test.ts tools/report-fit.test.ts \
            tools/validate-workout.test.ts tools/workout-history.test.ts \
            2>&1 | tee coverage-ts.log

      # Quality signals into the job summary, so every run carries the numbers
      # instead of leaving them to a README that rots.
      - name: Quality report
        if: always()
        run: |
          pct=$(grep -oE '^# all files *\| *[0-9.]+' coverage-ts.log | grep -oE '[0-9.]+$' || true)
          {
            echo "## Quality signals"
            echo
            node --experimental-strip-types --disable-warning=ExperimentalWarning \
              tools/quality-report.ts \
              ${pct:+--typescript-coverage "$pct%"}
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint XML resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate XML files
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libxml2-utils
          find . -name '*.xml' -not -path './.git/*' -print0 | xargs -0 -n1 xmllint --noout
      - name: Test local tool discovery
        run: node --experimental-strip-types --test tools/resolve-tool.test.ts

  mc-lint:
    name: Monkey C format & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache monkey-c tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: ~/.mc-tools
          key: monkey-c-rs-${{ env.MONKEY_C_RS_REV }}
      - name: Install the monkey-c toolchain
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/bombsimon/monkey-c-rs \
            --rev "$MONKEY_C_RS_REV" --locked --root ~/.mc-tools rafiki
      - name: Check formatting
        run: ~/.mc-tools/bin/rafiki fmt --check source
      - name: Lint
        run: ~/.mc-tools/bin/rafiki lint source

  garmin-resources:
    name: Validate Garmin resource contract
    runs-on: ubuntu-latest
    container:
      # Pinned, not :latest - a floating tag is how v2.10.0's font and
      # proprietary-file rework reached these jobs unannounced. Bump the
      # three occurrences together.
      image: ghcr.io/matco/connectiq-tester:v2.10.0
    steps:
      - uses: actions/checkout@v6
      - name: Validate Garmin resources and FIT presentation contract
        shell: bash
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends libxml2-utils
          bash tools/validate_fit_xml.sh
      # Warning-only: annotates the run when new compatible wearables appear
      # in the SDK that manifest.xml does not list yet.
      - name: Report new SDK wearables missing from the manifest
        shell: bash
        run: bash tools/check_manifest_devices.sh

  build-shards:
    # These are disposable compatibility builds. Release tags perform one clean
    # Garmin export to create the store-ready multi-device .iq package.
    name: Build manifest devices (shard ${{ matrix.label }}/8)
    needs: garmin-resources
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 0, label: 1 }
          - { shard: 1, label: 2 }
          - { shard: 2, label: 3 }
          - { shard: 3, label: 4 }
          - { shard: 4, label: 5 }
          - { shard: 5, label: 6 }
          - { shard: 6, label: 7 }
          - { shard: 7, label: 8 }
    container:
      # Same image the test job's action uses: monkeyc and device files included.
      # Pinned, not :latest - a floating tag is how v2.10.0's font and
      # proprietary-file rework reached these jobs unannounced. Bump the
      # three occurrences together.
      image: ghcr.io/matco/connectiq-tester:v2.10.0
    env:
      SHARD: ${{ matrix.shard }}
      SHARD_COUNT: 8
    steps:
      - uses: actions/checkout@v6
      - name: Compile this device shard
        shell: bash
        run: |
          openssl genrsa -out /tmp/key.pem 4096 2>/dev/null
          openssl pkcs8 -topk8 -inform PEM -outform DER -in /tmp/key.pem -out /tmp/key.der -nocrypt
          mkdir -p /tmp/sweep
          fails=0; total=0; index=0
          while IFS= read -r d; do
            if (( index % SHARD_COUNT != SHARD )); then
              index=$((index+1))
              continue
            fi
            index=$((index+1))
            total=$((total+1))
            if ! monkeyc -f monkey.jungle -d "$d" -o "/tmp/sweep/$d.prg" -y /tmp/key.der -l 3 > "/tmp/sweep/$d.log" 2>&1; then
              fails=$((fails+1))
              echo "::error::build failed for $d"
              cat "/tmp/sweep/$d.log"
            fi
          done < <(grep -o 'product id="[^"]*"' manifest.xml | cut -d'"' -f2)
          echo "Shard $((SHARD+1))/$SHARD_COUNT: $((total-fails))/$total devices build clean"
          test "$fails" -eq 0

  build-all:
    name: Build every manifest device
    needs: build-shards
    if: always()
    runs-on: ubuntu-latest
    env:
      SHARDS_RESULT: ${{ needs.build-shards.result }}
    steps:
      - name: Confirm all device shards passed
        run: |
          echo "Device shard result: $SHARDS_RESULT"
          test "$SHARDS_RESULT" = success

  test:
    name: Unit tests (${{ matrix.device }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # one representative per screen shape / display tech / API generation
        device:
          - instinct3solar45mm   # semi-octagon MIP with subwindow (primary target)
          - instinct2            # semi-octagon, CIQ 3.4, 96KB memory
          - fenix5               # round MIP, CIQ 3.1 (oldest supported API)
          - fenix7               # round MIP, CIQ 5.x
          - fr965                # round AMOLED
          - venu3                # round AMOLED, touch
          - venusq               # rectangle
          - vivoactive6          # newest API level 6
    steps:
      - uses: actions/checkout@v6
      - name: Compile and run unit tests
        uses: matco/action-connectiq-tester@v1
        with:
          device: ${{ matrix.device }}

  coverage:
    name: Function coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    container:
      # Pinned, not :latest - a floating tag is how v2.10.0's font and
      # proprietary-file rework reached these jobs unannounced. Bump the
      # three occurrences together.
      image: ghcr.io/matco/connectiq-tester:v2.10.0
    defaults:
      run:
        # The container's /bin/sh is dash; pipefail and tester.sh need bash.
        shell: bash
    steps:
      - uses: actions/checkout@v6

      # Coverage merged upstream (bombsimon/monkey-c-rs#1) and lives in the
      # unified rafiki binary since #8, so this installs the same upstream
      # revision the lint job pins rather than a fork.
      - name: Install rafiki
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends curl gcc libc6-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          "$HOME/.cargo/bin/cargo" install --quiet --git https://github.com/bombsimon/monkey-c-rs \
            --rev "$MONKEY_C_RS_REV" --locked rafiki

      # `source` is passed explicitly so stale instrumented copies under
      # build/ or tmp/ are never swept into the build. Test code is excluded
      # through its (:test) annotations.
      - name: Instrument sources
        run: |
          "$HOME/.cargo/bin/rafiki" coverage instrument source

      # tester.sh (from the container image) compiles ./monkey.jungle with
      # --unit-test at strict type checking and runs the suite in a headless
      # simulator; pointing the jungle at the instrumented tree makes its
      # captured output the coverage log. HOME=/root because the SDK's
      # device files live in root's home inside this image.
      - name: Run the suite instrumented
        run: |
          set -o pipefail
          printf 'project.manifest = manifest.xml\nbase.sourcePath = bin/coverage\nbase.excludeAnnotations = offscreenRender;swingTuning\n' > monkey.jungle
          HOME=/root tester.sh instinct3solar45mm 2>&1 | tee coverage-run.log

      # Printed, not uploaded. This used to also write Cobertura XML for
      # actions/upload-code-coverage, which needed a forked rafiki to produce
      # and fed a GitHub Code Quality integration that was never enabled -
      # with fail-on-error off, so it stayed quiet about doing nothing. The
      # per-function report in the log is the signal; the step still fails on
      # a broken instrumentation pipeline, which is what this job is here for.
      - name: Report coverage
        run: |
          "$HOME/.cargo/bin/rafiki" coverage report coverage-run.log

  synthetic-fit:
    name: Synthetic FIT and visual contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install FIT tooling
        run: npm ci --prefix tools
      - name: Generate and verify presentation fixture
        run: |
          node --experimental-strip-types tools/synthetic-workout.ts --check --output-dir build/synthetic-workout
          node --experimental-strip-types tools/report-fit.ts build/synthetic-workout/synthetic-workout.fit \
            -o build/synthetic-workout/synthetic-workout.html
          node --experimental-strip-types tools/validate-workout.ts build/synthetic-workout/synthetic-workout.fit
          node --experimental-strip-types --test --experimental-test-coverage \
            --test-coverage-include='tools/synthetic-workout.ts' \
            --test-coverage-lines=95 \
            tools/synthetic-workout.test.ts
      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-workout-visuals
          path: |
            build/synthetic-workout/synthetic-workout.fit
            build/synthetic-workout/synthetic-workout.svg
            build/synthetic-workout/synthetic-workout.html
          if-no-files-found: error
